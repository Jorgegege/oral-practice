<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语口语练习</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:#f5f7fa;color:#222;padding:16px;max-width:700px;margin:0 auto}
header{text-align:center;margin-bottom:20px}
h1{font-size:22px;margin-bottom:8px}
.tab{display:flex;gap:6px;margin-bottom:16px}
.tab button{flex:1;padding:10px;border:none;border-radius:8px;background:#e8edf6;font-size:15px;cursor:pointer}
.tab button.active{background:#2b65d9;color:#fff}
.box{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px #00000012;margin-bottom:16px}
.sentence{font-size:18px;line-height:1.6;margin-bottom:12px}
.ctrl{display:flex;gap:8px;flex-wrap:wrap}
button{padding:10px 14px;border-radius:8px;border:none;background:#2b65d9;color:#fff;cursor:pointer;font-size:14px}
button.secondary{background:#e2e8f0;color:#222}
.info{font-size:13px;color:#666;margin-top:10px}
#log{margin-top:12px;font-size:13px;color:#444;min-height:60px}
</style>
</head>
<body>
<header>
<h1>英语口语练习</h1>
</header>
<div class="tab">
<button class="active" data-type="en">英文句子</button>
<button data-type="cn">中文对照</button>
</div>
<div class="box">
<div class="sentence" id="sentence">Click 开始</div>
<div class="ctrl">
<button id="readBtn">朗读</button>
<button id="recBtn" class="secondary">录音识别</button>
<button id="nextBtn" class="secondary">下一句</button>
</div>
<div id="log"></div>
</div>
<div class="box info">
<p>提示：苹果Safari打开，需要允许麦克风权限；识别效果受网络、发音影响</p>
</div>
<script>
const sentences = [
{en:"I get up at seven every morning.",cn:"我每天早上七点起床。"},
{en:"What are you going to do this weekend?",cn:"你这个周末打算做什么？"},
{en:"I like reading books in my free time.",cn:"我空闲的时候喜欢看书。"},
{en:"The weather is nice today.",cn:"今天天气很好。"},
{en:"Could you help me please?",cn:"可以请你帮我一下吗？"},
{en:"I’m learning English now.",cn:"我现在正在学英语。"},
{en:"Where do you come from?",cn:"你来自哪里？"},
{en:"How much does it cost?",cn:"这个多少钱？"},
{en:"I will try my best.",cn:"我会尽我最大努力。"},
{en:"See you tomorrow.",cn:"明天见。"}
];
let idx=0;
let showMode="en";
const senEl=document.getElementById("sentence");
const logEl=document.getElementById("log");
const readBtn=document.getElementById("readBtn");
const recBtn=document.getElementById("recBtn");
const nextBtn=document.getElementById("nextBtn");
const tabs=document.querySelectorAll(".tab button");
function render(){
const s=sentences[idx];
senEl.innerText=showMode==="en"?s.en:s.cn;
}
tabs.forEach(b=>{
b.onclick=()=>{
tabs.forEach(x=>x.classList.remove("active"));
b.classList.add("active");
showMode=b.dataset.type;
render();
}
})
readBtn.onclick=()=>{
const utter=new SpeechSynthesisUtterance(sentences[idx].en);
utter.lang="en-US";
speechSynthesis.speak(utter);
logEl.innerText="正在朗读："+sentences[idx].en;
}
recBtn.onclick=async ()=>{
if(!("webkitSpeechRecognition" in window)&&!("SpeechRecognition" in window)){
logEl.innerText="你的浏览器不支持语音识别，推荐Safari";
return;
}
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
const rec=new SpeechRecognition();
rec.lang="en-US";
rec.start();
logEl.innerText="请对着麦克风读句子...";
rec.onresult=e=>{
const text=e.results[0][0].transcript.trim().toLowerCase();
const target=sentences[idx].en.toLowerCase();
logEl.innerText="识别结果："+text+"\n目标："+sentences[idx].en;
if(text===target) logEl.innerText+=" ✅ 正确！";
else logEl.innerText+=" ⚠️ 有差异";
rec.stop();
}
rec.onerror=e=>{
logEl.innerText="识别出错："+e.error;
}
}
nextBtn.onclick=()=>{
idx=(idx+1)%sentences.length;
render();
logEl.innerText="";
}
render();
</script>
</body>
</html>
