<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>oral-practice 跟读版</title>
  <style>
    :root {
      --bg: #f8f5ee;
      --card: #ffffff;
      --primary: #2c6e49;
      --primary-light: #e9f3ec;
      --text: #2d3436;
      --muted: #747d8c;
      --danger: #e74c3c;
      --border: #e2e2e2;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 90px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: var(--card);
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 20px;
    }
    .logo-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background-color: var(--primary);
      color: white;
      display: grid;
      place-items: center;
    }
    .streak {
      background: var(--primary-light);
      color: var(--primary);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 14px;
    }
    .container {
      padding: 16px;
    }
    .view {
      display: none;
    }
    .view.active {
      display: block;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .speed-row {
      display: flex;
      gap: 8px;
      margin: 12px 0 20px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary {
      background-color: var(--primary);
      color: white;
    }
    .btn-secondary {
      background-color: #efefef;
      color: var(--text);
    }
    .btn-secondary.active {
      background-color: var(--primary);
      color: white;
    }
    .mic-wrap {
      text-align: center;
      margin: 24px 0;
    }
    .mic-btn {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: none;
      background-color: var(--primary);
      color: white;
      font-size: 36px;
      display: grid;
      place-items: center;
      margin: 0 auto 12px;
    }
    .mic-btn.recording {
      background-color: var(--danger);
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    .audio-row {
      margin: 16px 0;
    }
    .action-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }
    .progress-bar {
      height: 10px;
      background-color: #e9ecef;
      border-radius: 999px;
      overflow: hidden;
      margin: 8px 0;
    }
    .progress-fill {
      height: 100%;
      background-color: var(--primary);
      width: 0%;
      transition: width 0.3s;
    }
    .tag {
      display: inline-block;
      background-color: var(--primary-light);
      color: var(--primary);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      margin: 4px;
    }
    .nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      border-top: 1px solid var(--border);
    }
    .nav-item {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }
    .nav-item.active {
      color: var(--primary);
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin: 10px 0;
      font-size: 16px;
    }
    .day-item {
      padding:12px;
      background:#fff;
      border-radius:10px;
      margin:8px 0;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <div class="logo-icon">💬</div>
      <span>oral-practice 跟读版</span>
    </div>
    <div class="streak">连续 <span id="streak">0</span> 天</div>
  </header>

  <div class="container">
    <div id="view-today" class="view active">
      <div class="card">
        <h3>今日计划（15-30 分钟）</h3>
        <div class="progress-bar">
          <div class="progress-fill" id="today-progress"></div>
        </div>
        <div id="today-list"></div>
      </div>
    </div>

    <div id="view-practice" class="view">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <h3 id="practice-title"></h3>
          <span class="tag" id="practice-tag"></span>
        </div>
        <p id="target-sentence" style="font-size:20px;margin:12px 0;line-height:1.6;"></p>
        <p id="target-trans" style="color:var(--muted);margin-bottom:12px;"></p>

        <div class="speed-row">
          <button class="btn btn-secondary speed" data-rate="0.7">慢速</button>
          <button class="btn btn-secondary speed active" data-rate="1.0">常速</button>
          <button class="btn btn-secondary speed" data-rate="1.3">轻快</button>
          <button class="btn btn-primary" id="play-demo">听示范</button>
        </div>

        <div class="mic-wrap">
          <button class="mic-btn" id="mic-btn">🎤</button>
          <p id="mic-tip">点击按钮录音跟读</p>
        </div>

        <div class="audio-row">
          <audio id="rec-audio" controls>
        </div>
        <div class="action-row">
          <button class="btn btn-secondary" id="btn-retry">重录</button>
          <button class="btn btn-secondary" id="btn-fav">收藏</button>
          <button class="btn btn-secondary" id="btn-wrong">加入错题</button>
          <button class="btn btn-primary" id="btn-next">下一句</button>
        </div>
      </div>
    </div>

    <div id="view-library" class="view">
      <div class="card">
        <h3>例句库</h3>
        <input type="text" id="search-lib" placeholder="搜索句子 / 分类...">
        <div id="lib-list"></div>
      </div>
    </div>

    <div id="view-review" class="view">
      <div class="card">
        <h3>错题 & 收藏</h3>
        <div id="review-list"></div>
      </div>
    </div>

    <div id="view-stats" class="view">
      <div class="card">
        <h3>学习统计</h3>
        <div id="stats-content"></div>
      </div>
    </div>
  </div>

  <nav class="nav">
    <div class="nav-item active" data-target="today">🏠<br>今日</div>
    <div class="nav-item" data-target="library">📖<br>词库</div>
    <div class="nav-item" data-target="review">⭐<br>复习</div>
    <div class="nav-item" data-target="stats">📊<br>统计</div>
  </nav>

<script>
const baseLibrary = [
  { en: "I hope you can push yourself a little further every day.", zh: "我希望你每天都能逼自己更进一步。", type: "日常", diff: "B1" },
  { en: "It is not the strongest of the species that survives, nor the most intelligent, but the one most responsive to change.", zh: "得以存活的不是最强、最聪明的物种，而是最能适应变化的那一个。", type: "名著", diff: "B2" },
  { en: "Hakuna Matata. It means no worries for the rest of your days.", zh: "无忧无虑，往后的日子不再烦恼。", type: "动画", diff: "A2" },
  { en: "Ask not what your country can do for you; ask what you can do for your country.", zh: "不要问国家能为你做什么，而要问你能为国家做什么。", type: "演讲", diff: "B2" },
  { en: "The only thing we have to fear is fear itself.", zh: "我们唯一需要恐惧的，是恐惧本身。", type: "演讲", diff: "B1" },
  { en: "Keep moving forward. Don't let the past hold you back.", zh: "继续向前，不要让过去拖累你。", type: "影视", diff: "B1" },
  { en: "Life is what happens to you while you're busy making other plans.", zh: "生活就是当你忙着做别的计划时，发生在你身上的事。", type: "名言", diff: "B1" },
  { en: "We hold these truths to be self-evident: that all men are created equal.", zh: "我们认为以下真理不言而喻：人人生而平等。", type: "文稿", diff: "C1" },
  { en: "The future belongs to those who believe in the beauty of their dreams.", zh: "未来属于那些相信梦想之美的人。", type: "演讲", diff: "B1" },
  { en: "Success is not final, failure is not fatal; it is the courage to continue that counts.", zh: "成功不是终点，失败也不是末日；重要的是继续前行的勇气。", type: "演讲", diff: "B2" },
  { en: "It was the best of times, it was the worst of times.", zh: "这是最好的时代，也是最坏的时代。", type: "名著", diff: "B1" },
  { en: "Education is the most powerful weapon which you can use to change the world.", zh: "教育是你可以用来改变世界最强大的武器。", type: "演讲", diff: "B2" },
  { en: "To be, or not to be: that is the question.", zh: "生存还是毁灭，这是一个值得考虑的问题。", type: "名著", diff: "B1" },
  { en: "I have a dream that my four little children will one day live in a nation where they will not be judged by the color of their skin but by the content of their character.", zh: "我梦想有一天，我的四个孩子生活在一个不以肤色，而以品格来评判他们的国度。", type: "演讲段落", diff: "C1" }
];

const STORAGE_KEY = "oral-practice-data";
let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
  streak: 0,
  lastStudyDate: "",
  todayDone: [],
  favorites: [],
  wrongs: [],
  speedRate: 1.0
};
let currentSentence = null;
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;

const views = ["today","practice","library","review","stats"];
const navItems = document.querySelectorAll(".nav-item");
const viewEls = {};
views.forEach(v=>viewEls[v]=document.getElementById("view-"+v));

navItems.forEach(el=>{
  el.onclick = ()=>{
    const target = el.dataset.target;
    switchView(target);
  }
})
function switchView(name){
  views.forEach(v=>{
    viewEls[v].classList.toggle("active",v===name);
  })
  navItems.forEach(n=>n.classList.toggle("active",n.dataset.target===name));
}

let utter = null;
const playDemoBtn = document.getElementById("play-demo");
const speedBtns = document.querySelectorAll(".speed");
speedBtns.forEach(btn=>{
  btn.onclick = ()=>{
    speedBtns.forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    state.speedRate = Number(btn.dataset.rate);
    saveState();
  }
})
playDemoBtn.onclick = ()=>{
  if(!currentSentence) return;
  if(utter) speechSynthesis.cancel();
  utter = new SpeechSynthesisUtterance(currentSentence.en);
  utter.lang = "en-US";
  utter.rate = state.speedRate;
  speechSynthesis.speak(utter);
}

const micBtn = document.getElementById("mic-btn");
const micTip = document.getElementById("mic-tip");
const recAudio = document.getElementById("rec-audio");

micBtn.onclick = async ()=>{
  if(isRecording){
    stopRecord();
    return;
  }
  await startRecord();
}
async function startRecord(){
  micBtn.classList.add("recording");
  micTip.textContent = "正在录音，请朗读句子";
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e=>audioChunks.push(e.data);
    mediaRecorder.onstop = ()=>{
      const blob = new Blob(audioChunks, {type:"audio/mp4"});
      recAudio.src = URL.createObjectURL(blob);
    }
    mediaRecorder.start();
    isRecording = true;
  }catch(err){
    micTip.textContent="麦克风打开失败";
    micBtn.classList.remove("recording");
  }
}
function stopRecord(){
  micBtn.classList.remove("recording");
  micTip.textContent="点击按钮录音跟读";
  isRecording = false;
  if(mediaRecorder) mediaRecorder.stop();
}

document.getElementById("btn-retry").onclick = ()=>{
  recAudio.src="";
}
document.getElementById("btn-fav").onclick = ()=>{
  if(!currentSentence) return;
  if(!state.favorites.find(x=>x.en===currentSentence.en)){
    state.favorites.push(currentSentence);
    saveState();
    alert("已收藏");
  }
}
document.getElementById("btn-wrong").onclick = ()=>{
  if(!currentSentence) return;
  if(!state.wrongs.find(x=>x.en===currentSentence.en)){
    state.wrongs.push(currentSentence);
    saveState();
    alert("加入错题");
  }
}
document.getElementById("btn-next").onclick = ()=>{
  loadRandomSentence();
  switchView("practice");
}

function loadRandomSentence(){
  const idx = Math.floor(Math.random()*baseLibrary.length);
  currentSentence = baseLibrary[idx];
  document.getElementById("target-sentence").textContent = currentSentence.en;
  document.getElementById("target-trans").textContent = currentSentence.zh;
  document.getElementById("practice-tag").textContent = currentSentence.type + " / " + currentSentence.diff;
  recAudio.src="";
}

function renderToday(){
  const today = new Date().toLocaleDateString();
  if(state.lastStudyDate !== today){
    state.todayDone = [];
    state.lastStudyDate = today;
  }
  const list = document.getElementById("today-list");
  list.innerHTML = "";
  const todayPool = [...baseLibrary].sort(()=>Math.random()-0.5).slice(0,10);
  todayPool.forEach((item,idx)=>{
    const done = state.todayDone.includes(idx);
    const div = document.createElement("div");
    div.className = "day-item";
    div.innerHTML = `<div style="display:flex;justify-content:space-between;"><span>${item.en}</span><span>${done?"✅完成":"待练习"}</span></div>`;
    div.onclick = ()=>{
      currentSentence = item;
      document.getElementById("target-sentence").textContent = currentSentence.en;
      document.getElementById("target-trans").textContent = currentSent
